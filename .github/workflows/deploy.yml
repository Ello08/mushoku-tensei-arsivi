name: Denetim

# Yayınlama artık Actions'a bağlı değil.
# GitHub Pages, gh-pages dalından yayınlıyor (build_type: legacy).
# Gerekçe: 2026-10-06'da GitHub Actions ve Pages derleme altyapısı
# "degraded_performance" durumundaydı ve işler hiç başlamıyordu.
# Bu iş yalnızca doğrulama yapar; yayınlamak için bkz. tools/yayinla.sh

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denetim
  cancel-in-progress: true

jobs:
  dogrula:
    name: Doğrula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sayfaları üret
        run: python3 tools/kur.py

      - name: Üretilen HTML depodaki sürümle aynı mı
        run: |
          if ! git diff --quiet -- '*.html'; then
            echo "::error::Üretilen HTML depoda yazan sürümden farklı."
            git --no-pager diff --stat -- '*.html'
            exit 1
          fi

      - name: Bağlantı / çapa / HTML / ikon denetimi
        run: python3 tools/dogrula.py

      - name: Veri katmanı duman testi
        run: node tools/test-veri.js

      - name: Mobil denetimi (320–360px)
        run: python3 tools/mobil-denetle.py

      - name: CSS denetimi
        run: python3 tools/css-denetle.py

      - name: Veri dosyaları yerinde mi
        run: |
          python3 - <<'PY'
          import json, os, sys
          gerekli = ["anime","manga","novel","karakterler","yaylar","dunya","temalar","ek-medya"]
          eksik = []
          for ad in gerekli:
              y = f"assets/data/{ad}.json"
              if not os.path.exists(y):
                  eksik.append(y); continue
              d = json.load(open(y, encoding="utf-8"))
              n = sum(len(v) for v in d.values() if isinstance(v, list))
              print(f"  {ad:14s} {n:5d} kayıt")
          if eksik:
              print("::error::Eksik/geçersiz veri:", *eksik, sep="\n  "); sys.exit(1)
          PY
