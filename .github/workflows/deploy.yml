name: Yayınla

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı dal için yalnızca son committen yayın yap
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  dogrula:
    name: Doğrula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sayfaları üret
        run: python3 tools/kur.py

      - name: Çıktının depodaki sürümle aynı olduğunu denetle
        run: |
          if ! git diff --quiet -- '*.html'; then
            echo "::error::Üretilen HTML, depoda yazan sürümden farklı."
            echo "Yerelde 'python3 tools/kur.py' çalıştırıp çıktıyı commit edin."
            git --no-pager diff --stat -- '*.html'
            exit 1
          fi

      - name: Bağlantı / çapa / HTML denetimi
        run: python3 tools/dogrula.py

      - name: Veri katmanı duman testi
        run: node tools/test-veri.js

      - name: Mobil denetimi (320–360px)
        run: python3 tools/mobil-denetle.py

      - name: CSS denetimi
        run: python3 tools/css-denetle.py

      - name: Veri dosyaları yerinde mi
        run: |
          python3 - <<'PY'
          import json, os, sys
          gerekli = ["anime","manga","novel","karakterler","yaylar","dunya","temalar","ek-medya"]
          eksik = []
          for ad in gerekli:
              y = f"assets/data/{ad}.json"
              if not os.path.exists(y):
                  eksik.append(y); continue
              try:
                  d = json.load(open(y, encoding="utf-8"))
                  n = sum(len(v) for v in d.values() if isinstance(v, list))
                  print(f"  {ad:14s} {n:5d} kayıt")
              except Exception as e:
                  eksik.append(f"{y} ({e})")
          if eksik:
              print("::error::Eksik/geçersiz veri:", *eksik, sep="\n  "); sys.exit(1)
          PY

  yayinla:
    name: GitHub Pages
    needs: dogrula
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: kaynak

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sayfaları üret
        working-directory: kaynak
        run: python3 tools/kur.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kaynak

      - id: deploy
        uses: actions/deploy-pages@v4
